name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          required_files=(
            AGENTS.md
            README.md
            docs/prd.md
            docs/architecture.md
            docs/tech_stack.md
            docs/tasks.md
            contracts/openapi.yaml
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Parse OpenAPI YAML
        shell: bash
        run: |
          ruby -e "require 'yaml'; spec = YAML.load_file('contracts/openapi.yaml'); abort('Missing OpenAPI version') unless spec['openapi']"

  backend:
    name: Backend Java 17 and PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bluemoon_test
          POSTGRES_USER: bluemoon_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bluemoon_test -d bluemoon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bluemoon_test
      SPRING_DATASOURCE_USERNAME: bluemoon_test
      SPRING_DATASOURCE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test and package backend
        working-directory: backend
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
